<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1e293b"/>

  <!-- Split: left half light, right half dark -->
  <clipPath id="left">
    <rect x="28" y="28" width="36" height="72"/>
  </clipPath>
  <clipPath id="right">
    <rect x="64" y="28" width="36" height="72"/>
  </clipPath>

  <!-- Light side (left) -->
  <g clip-path="url(#left)">
    <rect x="28" y="28" width="72" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <!-- Crosshair -->
    <line x1="64" y1="44" x2="64" y2="84" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="64" x2="84" y2="64" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="10" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Dark side (right) -->
  <g clip-path="url(#right)">
    <rect x="28" y="28" width="72" height="72" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Crosshair -->
    <line x1="64" y1="44" x2="64" y2="84" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="64" x2="84" y2="64" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="10" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Divider line -->
  <line x1="64" y1="28" x2="64" y2="100" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
