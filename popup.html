<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 240px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        padding: 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .option {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        cursor: pointer;
        user-select: none;
      }
      .option input[type="checkbox"] {
        width: 14px;
        height: 14px;
        margin: 0;
        cursor: pointer;
      }
      .option span {
        font-size: 13px;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        width: 100%;
        padding: 8px 0;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:active {
        background: #1e40af;
      }
      button.secondary {
        background: #475569;
      }
      button.secondary:hover {
        background: #334155;
      }
      button.secondary:active {
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <h1>Docs Shotter</h1>
    <label class="option">
      <input type="checkbox" id="padding-checkbox" checked />
      <span>Add 20px padding</span>
    </label>
    <div class="btn-group">
      <button id="capture-btn">Capture Element</button>
      <button id="viewport-btn" class="secondary">Capture Viewport</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
